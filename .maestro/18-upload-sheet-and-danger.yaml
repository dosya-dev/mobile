# The upload source sheet opens (nothing picked), and the delete-account
# screen renders. STRICTLY read-only: no picker is entered, nothing confirmed.
appId: dev.dosya
---
- launchApp
- retry:
    maxRetries: 3
    commands:
      - openLink: dosya://
      - extendedWaitUntil: { visible: "All", timeout: 20000 }
- runFlow:
    when:
      notVisible: "${E2E_WS}"
    commands:
      - tapOn: "Owner"
      - extendedWaitUntil: { visible: "Create workspace", timeout: 10000 }
      - scrollUntilVisible: { element: "${E2E_WS}", direction: DOWN, timeout: 10000 }
      - tapOn: "${E2E_WS}"
      - extendedWaitUntil: { visible: "All", timeout: 25000 }
- tapOn: "Upload"
- extendedWaitUntil: { visible: "Choose files", timeout: 10000 }
- assertVisible: "Take photo"
- assertVisible: "Choose photos"
- back
- extendedWaitUntil: { visible: "All", timeout: 15000 }
- openLink: dosya://delete-account
- extendedWaitUntil: { visible: "Delete account", timeout: 20000 }
- openLink: dosya://
- extendedWaitUntil: { visible: "All", timeout: 15000 }
