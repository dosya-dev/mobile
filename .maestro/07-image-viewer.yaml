# Open an image via search (listing order mutates as backups land), close it.
appId: dev.dosya
---
- launchApp
- retry:
    maxRetries: 3
    commands:
      - openLink: dosya://
      - extendedWaitUntil: { visible: "All", timeout: 20000 }
- runFlow:
    when:
      notVisible: "${E2E_WS}"
    commands:
      - tapOn: "Owner"
      - extendedWaitUntil: { visible: "Create workspace", timeout: 10000 }
      - scrollUntilVisible: { element: "${E2E_WS}", direction: DOWN, timeout: 10000 }
      - tapOn: "${E2E_WS}"
      - extendedWaitUntil: { visible: "All", timeout: 25000 }
- tapOn: "Search"
- inputText: "IMG_2338"
- extendedWaitUntil: { visible: "IMG_2338.PNG", timeout: 20000 }
- tapOn: "IMG_2338.PNG"
- extendedWaitUntil: { visible: "IMG_2338.PNG", timeout: 20000 }
- back
- openLink: dosya://
- extendedWaitUntil: { visible: "All", timeout: 15000 }
