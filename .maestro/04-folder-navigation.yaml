# Drill into a folder and come back. "Go back" is the in-folder header's label.
appId: dev.dosya
---
- launchApp
- retry:
    maxRetries: 3
    commands:
      - openLink: dosya://
      - extendedWaitUntil: { visible: "All", timeout: 20000 }
- runFlow:
    when:
      notVisible: "${E2E_WS}"
    commands:
      - tapOn: "Owner"
      - extendedWaitUntil: { visible: "Create workspace", timeout: 10000 }
      - scrollUntilVisible: { element: "${E2E_WS}", direction: DOWN, timeout: 10000 }
      - tapOn: "${E2E_WS}"
      - extendedWaitUntil: { visible: "All", timeout: 25000 }
- tapOn: "TEST-24"
- extendedWaitUntil:
    notVisible: "voice.mp3"
    timeout: 15000
- assertVisible: "TEST-24"
- back
- extendedWaitUntil: { visible: "All", timeout: 15000 }
