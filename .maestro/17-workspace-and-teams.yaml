# Workspace switcher sheet opens and closes; the teams screen renders.
appId: dev.dosya
---
- launchApp
- retry:
    maxRetries: 3
    commands:
      - openLink: dosya://
      - extendedWaitUntil: { visible: "All", timeout: 20000 }
- runFlow:
    when:
      notVisible: "${E2E_WS}"
    commands:
      - tapOn: "Owner"
      - extendedWaitUntil: { visible: "Create workspace", timeout: 10000 }
      - scrollUntilVisible: { element: "${E2E_WS}", direction: DOWN, timeout: 10000 }
      - tapOn: "${E2E_WS}"
      - extendedWaitUntil: { visible: "All", timeout: 25000 }
- tapOn: "${E2E_WS}"
- extendedWaitUntil: { visible: "Create workspace", timeout: 15000 }
- back
- extendedWaitUntil: { visible: "All", timeout: 15000 }
- openLink: dosya://teams
- extendedWaitUntil: { visible: "Send invite", timeout: 20000 }
- openLink: dosya://
- extendedWaitUntil: { visible: "All", timeout: 15000 }
