# Audio opens the player via search; stopApp so no music keeps playing.
appId: dev.dosya
---
- launchApp
- retry:
    maxRetries: 3
    commands:
      - openLink: dosya://
      - extendedWaitUntil: { visible: "All", timeout: 20000 }
- runFlow:
    when:
      notVisible: "${E2E_WS}"
    commands:
      - tapOn: "Owner"
      - extendedWaitUntil: { visible: "Create workspace", timeout: 10000 }
      - scrollUntilVisible: { element: "${E2E_WS}", direction: DOWN, timeout: 10000 }
      - tapOn: "${E2E_WS}"
      - extendedWaitUntil: { visible: "All", timeout: 25000 }
- tapOn: "Search"
- inputText: "voice"
- extendedWaitUntil: { visible: "voice.mp3", timeout: 20000 }
- tapOn: "voice.mp3"
- extendedWaitUntil: { visible: "voice.mp3", timeout: 20000 }
- stopApp
