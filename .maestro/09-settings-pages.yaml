# Every Settings destination via its own deep link, popping home between pages.
appId: dev.dosya
---
- launchApp
- retry:
    maxRetries: 3
    commands:
      - openLink: dosya://
      - extendedWaitUntil: { visible: "All", timeout: 20000 }
- runFlow:
    when:
      notVisible: "${E2E_WS}"
    commands:
      - tapOn: "Owner"
      - extendedWaitUntil: { visible: "Create workspace", timeout: 10000 }
      - scrollUntilVisible: { element: "${E2E_WS}", direction: DOWN, timeout: 10000 }
      - tapOn: "${E2E_WS}"
      - extendedWaitUntil: { visible: "All", timeout: 25000 }
- retry:
    maxRetries: 2
    commands:
      - openLink: dosya://profile
      - extendedWaitUntil: { visible: "Identity", timeout: 20000 }
- openLink: dosya://
- extendedWaitUntil: { visible: "All", timeout: 15000 }
- retry:
    maxRetries: 2
    commands:
      - openLink: dosya://workspaces
      - extendedWaitUntil: { visible: "My workspaces", timeout: 20000 }
- openLink: dosya://
- extendedWaitUntil: { visible: "All", timeout: 15000 }
- retry:
    maxRetries: 2
    commands:
      - openLink: dosya://workspace-dashboard
      - extendedWaitUntil: { visible: "Your storage", timeout: 35000 }
