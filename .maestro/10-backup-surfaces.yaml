# The Backup tab and its settings screen render; nothing is started or toggled.
appId: dev.dosya
---
- launchApp
- retry:
    maxRetries: 3
    commands:
      - openLink: dosya://
      - extendedWaitUntil: { visible: "All", timeout: 20000 }
- runFlow:
    when:
      notVisible: "${E2E_WS}"
    commands:
      - tapOn: "Owner"
      - extendedWaitUntil: { visible: "Create workspace", timeout: 10000 }
      - scrollUntilVisible: { element: "${E2E_WS}", direction: DOWN, timeout: 10000 }
      - tapOn: "${E2E_WS}"
      - extendedWaitUntil: { visible: "All", timeout: 25000 }
- tapOn: "Backup"
- extendedWaitUntil:
    visible: ".*(Ready|Backing up|Paused|Protected|Start backup|Continue backup).*"
    timeout: 20000
- scrollUntilVisible: { element: "What gets backed up", direction: DOWN, timeout: 10000 }
- openLink: dosya://backup-settings
- extendedWaitUntil: { visible: "Backup settings", timeout: 20000 }
- openLink: dosya://
- extendedWaitUntil: { visible: "All", timeout: 15000 }
