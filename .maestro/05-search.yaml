# Open search, type, get an answer, and return home via the root deep link
# (backing out of a keyboard is device-dependent; the link is deterministic).
appId: dev.dosya
---
- launchApp
- retry:
    maxRetries: 3
    commands:
      - openLink: dosya://
      - extendedWaitUntil: { visible: "All", timeout: 20000 }
- runFlow:
    when:
      notVisible: "${E2E_WS}"
    commands:
      - tapOn: "Owner"
      - extendedWaitUntil: { visible: "Create workspace", timeout: 10000 }
      - scrollUntilVisible: { element: "${E2E_WS}", direction: DOWN, timeout: 10000 }
      - tapOn: "${E2E_WS}"
      - extendedWaitUntil: { visible: "All", timeout: 25000 }
- tapOn: "Search"
- inputText: "test"
- extendedWaitUntil:
    visible: ".*(TEST|test|No results).*"
    timeout: 20000
- back
- openLink: dosya://
- extendedWaitUntil: { visible: "All", timeout: 15000 }
